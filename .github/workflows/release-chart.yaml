name: Release chart

on:
  push:
    branches: [main]
    paths:
      - "charts/**"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-chart
  cancel-in-progress: false

env:
  CHART_PATH: charts/karpenter
  CHART_NAME: karpenter-provider-rackspace-spot

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Derive snapshot chart version
        id: ver
        run: |
          BASE=$(awk '/^version:/{print $2; exit}' "${CHART_PATH}/Chart.yaml")
          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE%%-*}"
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-snapshot.${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Snapshot chart version: ${VERSION}"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Package + push
        run: |
          mkdir -p dist
          helm package "${CHART_PATH}" \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "sha-${GITHUB_SHA}" \
            --destination dist
          helm push "dist/${CHART_NAME}-${{ steps.ver.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Sign chart (cosign keyless)
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/charts/${CHART_NAME}:${{ steps.ver.outputs.version }}"
